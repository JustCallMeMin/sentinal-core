version: '3.8'

services:
  # Database: PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: sentinal-db
    environment:
      POSTGRES_USER: sentinal
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: sentinal_core
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sentinal -d sentinal_core" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache & Real-time: Redis
  redis:
    image: redis:7-alpine
    container_name: sentinal-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application: Sentinal Core API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinal-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://sentinal:password123@postgres:5432/sentinal_core?sslmode=disable
      LOG_LEVEL: debug
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  postgres_data:
